<div class="card space-y-5">
  <div class="flex flex-wrap items-end gap-3">
    <div class="min-w-[14rem] flex-1">
      <label for="fcolor-input" class="label">Color</label>
      <input id="fcolor-input" type="text" spellcheck="false" autocomplete="off" value="#6750A4" placeholder="#6750A4, rgb(103 80 164), hsl(…), Color(0xFF6750A4)" class="field font-mono">
    </div>
    <div><label for="fcolor-picker" class="label">Picker</label><input id="fcolor-picker" type="color" value="#6750a4" class="h-11 w-16 cursor-pointer rounded-xl border border-zinc-300 bg-transparent p-1 dark:border-zinc-700"></div>
    <div class="min-w-[10rem]">
      <div class="flex justify-between"><label for="fcolor-alpha" class="label">Opacity</label><span id="fcolor-alpha-value" class="font-mono text-xs text-zinc-500">100%</span></div>
      <input id="fcolor-alpha" type="range" min="0" max="255" value="255" class="w-full accent-indigo-600">
    </div>
    <div id="fcolor-swatch" class="preview-stage checker h-11 min-h-0 w-24 p-0" aria-hidden="true"><div class="h-full w-full rounded-[10px]"></div></div>
  </div>
  <p class="text-xs text-zinc-500 dark:text-zinc-400">8-digit values: <span class="font-mono">#RRGGBBAA</span> is read CSS-style; <span class="font-mono">0xAARRGGBB</span> and <span class="font-mono">Color(0x…)</span> are read Flutter-style.</p>
  <div id="fcolor-status" class="status" data-state="idle" role="status" aria-live="polite"></div>
  <div id="fcolor-outputs" class="grid gap-2 md:grid-cols-2"></div>
  <div class="space-y-3 rounded-xl border border-zinc-200 p-4 dark:border-zinc-800">
    <div class="flex flex-wrap items-end justify-between gap-3">
      <div>
        <h2 class="text-sm font-semibold">MaterialColor swatch</h2>
        <p class="text-xs text-zinc-500 dark:text-zinc-400">Shades 50–900 made by mixing with white and black. A practical approximation, not an official Material palette.</p>
      </div>
      <div><label for="fcolor-name" class="label">Name</label><input id="fcolor-name" type="text" value="brand" spellcheck="false" class="field w-40 font-mono"></div>
    </div>
    <div id="fcolor-shades" class="grid grid-cols-5 gap-1 sm:grid-cols-10"></div>
    <div>
      <div class="mb-1.5 flex items-center justify-between"><span class="label mb-0">Dart</span><button type="button" data-copy="#fcolor-material"></button></div>
      <pre id="fcolor-material" class="out max-h-72 overflow-auto whitespace-pre text-[13px] leading-6" data-raw="" tabindex="0" role="region" aria-label="MaterialColor Dart code"></pre>
    </div>
  </div>
</div>
