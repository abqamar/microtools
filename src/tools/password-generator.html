<div class="card space-y-6">
  <div>
    <div class="flex items-stretch gap-2">
      <div id="pw-output" class="out flex min-h-[3.5rem] flex-1 items-center break-all text-lg tracking-wide" aria-live="polite"></div>
      <div class="flex flex-col gap-2 sm:flex-row">
        <button type="button" data-copy="#pw-output"></button>
        <button id="pw-regen" type="button" class="copy-btn" aria-label="Generate new password">
          <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
          <span>New</span>
        </button>
      </div>
    </div>
    <div class="mt-3">
      <div class="grid grid-cols-4 gap-1.5" aria-hidden="true">
        <span class="pw-bar h-1.5 rounded-full bg-zinc-200 transition-colors dark:bg-zinc-800"></span>
        <span class="pw-bar h-1.5 rounded-full bg-zinc-200 transition-colors dark:bg-zinc-800"></span>
        <span class="pw-bar h-1.5 rounded-full bg-zinc-200 transition-colors dark:bg-zinc-800"></span>
        <span class="pw-bar h-1.5 rounded-full bg-zinc-200 transition-colors dark:bg-zinc-800"></span>
      </div>
      <div class="mt-2 flex flex-wrap items-center justify-between gap-2 text-xs">
        <span>Strength: <strong id="pw-strength" class="font-semibold">—</strong></span>
        <span id="pw-entropy" class="text-zinc-500 dark:text-zinc-400"></span>
      </div>
    </div>
  </div>
  <div>
    <div class="mb-2 flex items-center justify-between">
      <label for="pw-length" class="label mb-0">Length</label>
      <span id="pw-length-value" class="rounded-md bg-indigo-600 px-2 py-0.5 font-mono text-xs font-semibold text-white">20</span>
    </div>
    <input id="pw-length" type="range" min="8" max="64" value="20" class="w-full accent-indigo-600">
    <div class="mt-1 flex justify-between font-mono text-[11px] text-zinc-400"><span>8</span><span>64</span></div>
  </div>
  <fieldset>
    <legend class="label">Character sets</legend>
    <div class="grid grid-cols-1 gap-2 sm:grid-cols-2">
      <label class="check"><input type="checkbox" data-pw-set="upper" checked> Uppercase <span class="ml-auto font-mono text-xs text-zinc-400">A–Z</span></label>
      <label class="check"><input type="checkbox" data-pw-set="lower" checked> Lowercase <span class="ml-auto font-mono text-xs text-zinc-400">a–z</span></label>
      <label class="check"><input type="checkbox" data-pw-set="numbers" checked> Numbers <span class="ml-auto font-mono text-xs text-zinc-400">0–9</span></label>
      <label class="check"><input type="checkbox" data-pw-set="symbols" checked> Symbols <span class="ml-auto font-mono text-xs text-zinc-400">!@#$</span></label>
    </div>
    <p id="pw-hint" class="mt-2 hidden text-xs text-amber-600 dark:text-amber-400">At least one character set must stay selected.</p>
  </fieldset>
</div>
