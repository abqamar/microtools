<div class="card space-y-4">
  <div id="imgr-drop" class="dropzone" data-drag="false">
    <p class="text-sm font-medium">Drop an image here</p>
    <p class="text-xs text-zinc-500 dark:text-zinc-400">or <button id="imgr-pick" type="button" class="font-medium text-indigo-600 underline underline-offset-2 dark:text-indigo-400">choose an image</button> · PNG, JPEG, WebP, GIF, BMP, SVG</p>
    <input id="imgr-file" type="file" accept="image/*" hidden>
  </div>
  <div id="imgr-controls" class="space-y-4" hidden>
    <div class="flex flex-wrap items-end gap-3">
      <div><label for="imgr-w" class="label">Width</label><input id="imgr-w" type="number" min="1" max="16384" class="field w-28 font-mono"></div>
      <div><label for="imgr-h" class="label">Height</label><input id="imgr-h" type="number" min="1" max="16384" class="field w-28 font-mono"></div>
      <label class="check"><input id="imgr-lock" type="checkbox" checked> Keep aspect ratio</label>
      <div>
        <label for="imgr-format" class="label">Format</label>
        <select id="imgr-format" class="field w-auto"><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option><option value="image/png">PNG</option></select>
      </div>
      <div id="imgr-quality-wrap" class="min-w-[10rem] flex-1">
        <div class="flex justify-between"><label for="imgr-quality" class="label">Quality</label><span id="imgr-quality-value" class="font-mono text-xs text-zinc-500">80</span></div>
        <input id="imgr-quality" type="range" min="10" max="100" value="80" class="w-full accent-indigo-600">
      </div>
    </div>
    <dl class="grid grid-cols-2 gap-3 sm:grid-cols-4">
      <div class="stat"><dt>Original</dt><dd id="imgr-orig">—</dd></div>
      <div class="stat"><dt>Result</dt><dd id="imgr-result">—</dd></div>
      <div class="stat"><dt>Saved</dt><dd id="imgr-saved">—</dd></div>
      <div class="stat"><dt>Dimensions</dt><dd id="imgr-dims">—</dd></div>
    </dl>
    <div class="flex justify-end"><a id="imgr-download" class="btn btn-primary py-2">Download</a></div>
    <div class="preview-stage checker"><img id="imgr-preview" alt="Resized image preview" class="max-h-[28rem] max-w-full object-contain"></div>
  </div>
  <div id="imgr-status" class="status" data-state="idle" role="status" aria-live="polite">Choose an image to get started.</div>
</div>
