<div class="card space-y-5">
  <div class="flex flex-wrap items-end gap-3">
    <div><label for="scheme-seed" class="label">Seed color</label><input id="scheme-seed" type="text" spellcheck="false" value="#6750A4" class="field w-36 font-mono"></div>
    <div><label for="scheme-picker" class="label">Picker</label><input id="scheme-picker" type="color" value="#6750a4" class="h-11 w-16 cursor-pointer rounded-xl border border-zinc-300 bg-transparent p-1 dark:border-zinc-700"></div>
    <div>
      <label for="scheme-variant" class="label">Variant</label>
      <select id="scheme-variant" class="field w-auto">
        <option value="tonalSpot">tonalSpot (default)</option><option value="fidelity">fidelity</option><option value="content">content</option>
        <option value="vibrant">vibrant</option><option value="expressive">expressive</option><option value="neutral">neutral</option>
        <option value="monochrome">monochrome</option><option value="rainbow">rainbow</option><option value="fruitSalad">fruitSalad</option>
      </select>
    </div>
    <div>
      <span class="label" id="scheme-code-label">Code</span>
      <div class="inline-flex gap-1 rounded-xl border border-zinc-300 p-1 dark:border-zinc-700" role="radiogroup" aria-labelledby="scheme-code-label">
        <button type="button" role="radio" class="seg" data-scheme-code="seed">fromSeed</button>
        <button type="button" role="radio" class="seg" data-scheme-code="explicit">Explicit colors</button>
      </div>
    </div>
  </div>
  <div id="scheme-status" class="status" data-state="idle" role="status" aria-live="polite">Loading color engine…</div>
  <div class="grid gap-4 lg:grid-cols-2">
    <div><h2 class="mb-2 text-sm font-semibold">Light</h2><div id="scheme-mock-light"></div><div id="scheme-light" class="mt-3 grid grid-cols-2 gap-1.5 sm:grid-cols-3"></div></div>
    <div><h2 class="mb-2 text-sm font-semibold">Dark</h2><div id="scheme-mock-dark"></div><div id="scheme-dark" class="mt-3 grid grid-cols-2 gap-1.5 sm:grid-cols-3"></div></div>
  </div>
  <div>
    <div class="mb-1.5 flex items-center justify-between"><span class="label mb-0">Dart</span><button type="button" data-copy="#scheme-code"></button></div>
    <pre id="scheme-code" class="out max-h-[28rem] overflow-auto whitespace-pre text-[13px] leading-6" data-raw="" tabindex="0"></pre>
  </div>
</div>
