<div class="card space-y-4">
  <div class="flex flex-wrap items-end gap-3">
    <div>
      <label for="cardgen-brand" class="label">Brand</label>
      <select id="cardgen-brand" class="field w-auto">
        <option value="visa">Visa</option>
        <option value="mastercard">Mastercard</option>
        <option value="amex">American Express</option>
        <option value="discover">Discover</option>
        <option value="jcb">JCB</option>
        <option value="diners">Diners Club</option>
        <option value="unionpay">UnionPay</option>
        <option value="mix">Random mix</option>
      </select>
    </div>
    <div>
      <label for="cardgen-count" class="label">How many</label>
      <input id="cardgen-count" type="number" min="1" max="100" value="10" class="field w-24 font-mono">
    </div>
    <div>
      <label for="cardgen-format" class="label">Output</label>
      <select id="cardgen-format" class="field w-auto">
        <option value="list">List</option>
        <option value="csv">CSV</option>
        <option value="json">JSON</option>
      </select>
    </div>
    <button id="cardgen-generate" type="button" class="btn btn-primary ml-auto">Generate</button>
  </div>
  <div class="flex flex-wrap gap-2">
    <label class="check"><input id="cardgen-spaced" type="checkbox" checked> Group digits</label>
    <label class="check"><input id="cardgen-extras" type="checkbox" checked> Include expiry &amp; CVV</label>
  </div>
  <div class="flex gap-3 rounded-xl border border-amber-500/30 bg-amber-500/10 px-4 py-3 text-sm text-amber-800 dark:text-amber-300" role="note">
    <svg class="mt-0.5 h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z"/></svg>
    <p>For testing only. These numbers pass format and Luhn checks but are not issued cards and cannot be charged. To test a payment gateway, use your provider's official sandbox cards (for example Stripe's <span class="font-mono">4242 4242 4242 4242</span>).</p>
  </div>
  <div>
    <div class="mb-1.5 flex items-center justify-between">
      <span id="cardgen-summary" class="label mb-0">Output</span>
      <button type="button" data-copy="#cardgen-output" data-copy-label="Copy all"></button>
    </div>
    <textarea id="cardgen-output" rows="12" readonly spellcheck="false" class="out resize-y leading-6" aria-labelledby="cardgen-summary"></textarea>
  </div>
</div>
